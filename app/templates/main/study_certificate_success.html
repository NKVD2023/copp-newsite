<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка успешно отправлена</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/ркиг.png') }}">
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=999">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rkig-red: #9d2124;
            --rkig-red-hover: #82191c;
            --rkig-green: #045156;
            --rkig-dark: #1a1a1a;
            --rkig-white: #ffffff;
        }

        body {
            background-color: #f7f9f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 0;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--rkig-dark);
        }

        .global-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .blob-1 {
            position: absolute;
            top: -100px;
            right: -80px;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(157, 33, 36, 0.08) 0%, rgba(157, 33, 36, 0) 70%);
            border-radius: 50%;
        }
        .blob-2 {
            position: absolute;
            bottom: -100px;
            left: -80px;
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, rgba(4, 81, 86, 0.09) 0%, rgba(4, 81, 86, 0) 70%);
            border-radius: 50%;
        }

        .success-card {
            background: var(--rkig-white);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.03);
            border: 1px solid #e9ecef;
            overflow: hidden;
            padding: 0;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .success-card-body {
            padding: 3.2rem 2.4rem;
        }

        .check-icon-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(4, 81, 86, 0.1);
            color: var(--rkig-green);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 2.8rem;
        }

        .college-logo-mini {
            width: 50px;
            height: auto;
            margin-bottom: 1rem;
        }

        .notice-box {
            background-color: #fafbfb;
            border: 1px solid #e1e7e7;
            border-left: 5px solid var(--rkig-red);
            border-radius: 10px;
            padding: 1.3rem 1.6rem;
            margin: 2rem 0;
            text-align: left;
            color: var(--rkig-dark);
        }

        .notice-box strong {
            color: var(--rkig-red);
        }
    </style>
</head>
<body>
    <div class="global-blobs">
        <div class="blob-1"></div>
        <div class="blob-2"></div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="success-card">
                    <div class="success-card-body">
                        <div>
                            <img src="{{ url_for('static', filename='img/ркиг.png') }}" alt="РКИГ" class="college-logo-mini" onerror="this.style.display='none'">
                        </div>
                        <div class="check-icon-circle">
                            <i class="fas fa-check"></i>
                        </div>
                        <h3 class="fw-bold mb-2" style="color: var(--rkig-dark);">Заявка успешно принята!</h3>
                        <p class="text-muted small">ГБПОУ РК «Романовский колледж индустрии гостеприимства»</p>
                        
                        <div class="notice-box">
                            <div class="d-flex align-items-center mb-2">
                                <i class="fas fa-info-circle me-2 fs-5" style="color: var(--rkig-red);"></i>
                                <span class="fw-bold">Информация о готовности:</span>
                            </div>
                            <p class="mb-2">
                                Справка будет готова <strong>в течение 3 рабочих дней</strong>.
                            </p>
                            <p class="mb-0">
                                Забрать готовую справку можно <strong>в администрации колледжа</strong>.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
